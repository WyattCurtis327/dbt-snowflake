snapshots:
  - name: snap_customer_vip
    # Snowflake: landing already COPYed. DuckDB: the seed of the same name.
    relation: "{{ source('landing', 'raw_customers') if target.type == 'snowflake' else ref('raw_customers') }}"
    config:
      unique_key: customer_id
      strategy: timestamp
      updated_at: updated_at
      dbt_valid_to_current: "cast('9999-12-31' as timestamp)"
