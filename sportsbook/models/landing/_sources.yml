version: 2
sources:
  - name: landing
    description: >
      First stop after PUT/COPY (Snowflake) or dbt seed (DuckDB).
      Not bronze — brz_* models rename, cast, and dedupe from here.
    schema: "{{ 'LANDING' if target.type == 'snowflake' else 'landing' }}"
    tables:
      - name: raw_bets
        loaded_at_field: placed_at_utc
      - name: raw_customers
      - name: raw_payments
      - name: raw_kyc_events
      - name: state_tax_rates
