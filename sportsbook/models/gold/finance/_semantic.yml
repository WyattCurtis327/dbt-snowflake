# Daily time spine for MetricFlow (latest YAML spec).
# Finance metrics live on fct_bets in ../_gold.yml — do not re-declare
# top-level semantic_models / measures here (Fusion dbt1157).
models:
  - name: sem_time_spine
    description: >
      One row per day in 2026. MetricFlow standard time spine. Join key for
      time-aware metrics on sem_bets (settled_date_et). Not a business fact.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date (2026). MetricFlow standard time-spine column.
        granularity: day
